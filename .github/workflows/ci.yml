name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (no mounts)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: brew install openssl@3 || true
      - name: Build and run every test that does not mount a filesystem
        run: make test

  linux-device:
    name: device server on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: Build and test the device side (server, store, secure channel, pairings)
        run: make linux-test

  android:
    name: Android agent (all ABIs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the APK for arm64, x86_64 and 32-bit ARM (SQLite and OpenSSL are fetched and checked against pinned hashes)
        env:
          ABIS: arm64-v8a x86_64 armeabi-v7a
        run: android/build.sh

  format:
    name: format (changed lines only)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install clang-format
        run: brew install clang-format
      - name: Check the lines this PR changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          out=$(git clang-format --diff --extensions c,cc,cpp,h,hpp "$BASE_SHA" -- || true)
          if echo "$out" | grep -qE "no modified files to format|did not modify any files"; then
            echo "formatting OK"
          else
            echo "$out"
            echo "::error::clang-format would change lines touched by this PR. Run: git clang-format $BASE_SHA"
            exit 1
          fi

  shell-lint:
    name: shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck every tracked shell script (warnings and errors fail the build)
        run: git ls-files '*.sh' | xargs shellcheck -S warning

  coverage:
    name: coverage (device side, a signal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev
      - name: Line coverage of the device-side tests (reported, not enforced, because a target becomes a ceiling)
        run: |
          { echo '### Line coverage (device side)'; echo '```'; scripts/coverage.sh; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
