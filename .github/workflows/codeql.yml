name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Dependencies
        run: brew install openssl@3 || true
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Compile the core (CodeQL traces compiler calls; on Apple-silicon runners it runs builds under Rosetta, where the arm64-only OpenSSL cannot be linked, and linking adds nothing to the analysis)
        run: make build/ledger.o build/crypto.o build/devicestore.o build/deviceclient.o build/replicator.o build/dropengine.o build/overlay.o build/scanner.o build/policy.o build/spaceprobe.o build/recovery.o build/daemon.o build/tfs_c.o build/chunkcache.o build/metastore.o build/tierclient.o
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          category: "/language:c-cpp"
