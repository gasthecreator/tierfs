name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: brew install openssl@3 || true
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Compile the core (CodeQL traces compiler calls; on Apple-silicon runners it runs builds under Rosetta, where the arm64-only OpenSSL cannot be linked, and linking adds nothing to the analysis)
        run: make build/ledger.o build/crypto.o build/devicestore.o build/deviceclient.o build/replicator.o build/dropengine.o build/overlay.o build/scanner.o build/policy.o build/spaceprobe.o build/recovery.o build/daemon.o build/tfs_c.o build/keysource.o build/keychain_mac.o build/securechannel.o build/chunkcache.o build/metastore.o build/tierclient.o
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:c-cpp"
