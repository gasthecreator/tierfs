name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Dependencies
        run: brew install openssl@3 || true
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build (the core, the tools and the device server; no FUSE needed)
        run: make build/tierctl build/tierfs-device build/tierfs-backend build/daemon.o build/overlay.o build/scanner.o build/policy.o
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          category: "/language:c-cpp"
